# reproit GitHub Action (composite).
#
# Two modes, selected by which input is set:
#
# FUZZ MODE (`app`): on a pull request it fuzzes your app, and on a finding
# it uploads a minimized, annotated repro to the cloud and posts the PR
# comment (summary, suspected file:line, cohort, inline clip, dashboard
# link). Consumers reference it as `uses: reproit/reproit@v1`.
#
#   - uses: reproit/reproit@v1
#     with:
#       app: http://localhost:3000
#       bucket: web-pr
#       api-key: ${{ secrets.REPROIT_CLOUD_KEY }}
#
# CI CAPTURE MODE (`test-command`, Node test runner only): runs your
# test command with the reproit SDK's CI capture mode enabled
# (REPROIT_CI_CAPTURE=1). A failing test spools a replayable capsule; a red
# job uploads the spool as a job artifact and prints the exact local repro
# command in the job summary. Fully local-first: this mode contacts no cloud
# and needs no api-key.
#
#   - uses: reproit/reproit@v1
#     with:
#       test-command: node tests/checkout.test.mjs
#
# Composite (not Docker) so it is fast and runs on any hosted or self-hosted
# runner. It installs a RELEASED reproit binary (no cargo build) via the repo's
# install.sh, so onboarding is seconds, not a from-source compile.
#
# Relationship to .github/workflows/reproit-pr.yml: that file is a `workflow_call`
# reusable workflow that builds reproit FROM SOURCE on macOS with an iOS
# simulator (the dogfood / video-recording tier). This action is the
# released-binary, runner-agnostic onboarding tier. They are kept separate on
# purpose; see action.README.md.

name: "reproit"
description: >-
  Fuzz your app on every PR; upload a minimized repro and comment when a finding appears.
author: "reproit"

branding:
  icon: "zap"
  color: "purple"

inputs:
  app:
    description: >-
      What to fuzz: a URL or build directory. No reproit.yaml is required.
      Required for the fuzz mode (ignored when test-command is set).
    required: false
    default: ""
  bucket:
    description: >-
      Cloud bucket the finding's evidence is published to (e.g. web-pr).
      Required for the fuzz mode.
    required: false
    default: ""
  api-key:
    description: >-
      reproit cloud API key. Pass a secret, e.g. ${{ secrets.REPROIT_CLOUD_KEY }}.
      Required for the fuzz mode; the CI capture mode never contacts the cloud.
    required: false
    default: ""
  test-command:
    description: >-
      CI capture mode (Node test runner): the test command to run
      with capture enabled. A red run uploads the capsule spool as a job
      artifact and prints the local repro command in the job summary.
    required: false
    default: ""
  spool-dir:
    description: "Capsule spool directory the SDK writes to in CI capture mode."
    required: false
    default: ".reproit/ci-spool"
  artifact-name:
    description: "Name of the uploaded capsule artifact in CI capture mode."
    required: false
    default: "reproit-ci-capsules"
  cloud-url:
    description: "reproit cloud base URL."
    required: false
    default: "https://cloud.reproit.com"
  journey:
    description: "Explorer journey to drive."
    required: false
    default: "explore"
  runs:
    description: "Number of fuzz seeds to try."
    required: false
    default: "20"
  version:
    description: "reproit release to install (e.g. v1.0.0), or 'latest'."
    required: false
    default: "latest"
  only:
    description: >-
      Comma-separated oracle categories to run. Empty enables every category.
    required: false
    default: ""
  no:
    description: "Exclude these oracle categories (comma list). Applied after `only`."
    required: false
    default: ""
  confirm-on-sim:
    description: >-
      Confirm findings on the simulator tier. Requires a macOS simulator runner.
    required: false
    default: "false"
  cloud-app:
    description: >-
      Cloud app id for evidence. Only older CLI versions require it with the bucket.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # ---- CI capture mode (test-command set): no install, no cloud. ----

    - name: Run the test command with CI capture enabled
      if: ${{ inputs.test-command != '' }}
      id: ci-test
      shell: bash
      env:
        REPROIT_CI_CAPTURE: "1"
        REPROIT_CI_SPOOL: ${{ inputs.spool-dir }}
      run: |
        set -uo pipefail
        # The exit code is recorded, not raised: the capsule artifact and the
        # repro summary must ship BEFORE the job goes red, and the final step
        # re-raises it so a failing suite still fails the job.
        status=0
        bash -c "${{ inputs.test-command }}" || status="$?"
        echo "status=$status" >> "$GITHUB_OUTPUT"

    - name: Publish the local repro command for a red test job
      if: ${{ inputs.test-command != '' && steps.ci-test.outputs.status != '0' }}
      shell: bash
      run: |
        set -euo pipefail
        spool="${{ inputs.spool-dir }}"
        {
          echo "## reproit captured the failing test run"
          echo
          if compgen -G "$spool/capsule-*.json" > /dev/null; then
            echo "Download the capsule artifact and re-execute the exact" \
              "failing run locally, recorded dependencies included:"
            echo
            echo '```sh'
            echo "gh run download ${{ github.run_id }}" \
              "-n ${{ inputs.artifact-name }} -D ${{ inputs.spool-dir }}"
            for capsule in "$spool"/capsule-*.json; do
              echo "reproit check $capsule --exec \"${{ inputs.test-command }}\""
            done
            echo '```'
          else
            echo "The test job failed but no capsule was spooled (the" \
              "failing test may not run under the reproit ci wrapper)."
          fi
          if [ -f "$spool/dropped.count" ]; then
            echo
            echo "Spool cap reached: $(cat "$spool/dropped.count") capsule(s)" \
              "dropped."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the capsule spool as a job artifact
      if: ${{ inputs.test-command != '' && steps.ci-test.outputs.status != '0' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.spool-dir }}
        if-no-files-found: ignore

    - name: Fail the job exactly as the test command did
      if: ${{ inputs.test-command != '' }}
      shell: bash
      run: exit "${{ steps.ci-test.outputs.status }}"

    # ---- Fuzz mode (default): install the released binary and fuzz. ----

    - name: Check fuzz-mode inputs
      if: ${{ inputs.test-command == '' }}
      shell: bash
      run: |
        set -euo pipefail
        # These were `required: true` before the CI capture mode existed, but
        # required action inputs are advisory, so the mode checks them itself
        # and fails with the missing name instead of a confusing fuzz error.
        for pair in "app=${{ inputs.app }}" "bucket=${{ inputs.bucket }}" \
          "api-key=${{ inputs.api-key }}"; do
          if [ -z "${pair#*=}" ]; then
            echo "fuzz mode requires the '${pair%%=*}' input (or set" \
              "test-command for the CI capture mode)" >&2
            exit 1
          fi
        done

    - name: Install reproit (released binary)
      if: ${{ inputs.test-command == '' }}
      shell: bash
      run: |
        set -euo pipefail
        export REPROIT_BIN_DIR="$HOME/.local/bin"
        if [ "${{ inputs.version }}" != "latest" ]; then
          export REPROIT_VERSION="${{ inputs.version }}"
        fi
        # install.sh fetches the pinned release binary + the web runner bundle
        # (no cargo build). It is the same installer end users curl|sh.
        sh "${{ github.action_path }}/install.sh"
        echo "$REPROIT_BIN_DIR" >> "$GITHUB_PATH"

    - name: Install web runner browser deps
      # Only for web targets (a URL): fetch chromium + its system libraries so
      # the headless runner can drive/annotate on a clean CI image.
      if: >-
        ${{ inputs.test-command == '' &&
            (startsWith(inputs.app, 'http://') || startsWith(inputs.app, 'https://')) }}
      shell: bash
      run: bash "${{ github.action_path }}/.github/scripts/reproit-action-web-deps.sh"

    - name: Fuzz and deliver
      if: ${{ inputs.test-command == '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        REPROIT_CLOUD_URL: ${{ inputs.cloud-url }}
        REPROIT_CLOUD_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        # Mirrors reproit-pr.yml's invocation. `app` is the fuzz TARGET (passed
        # positionally, zero-config), evidence is published by --bucket, and
        # --post-comment POSTs the PR comment (github.token + the pull_request
        # event supply repo + PR + auth). A delivery failure never fails the run.
        args=( internal fuzz "${{ inputs.app }}"
          --journey "${{ inputs.journey }}"
          --runs "${{ inputs.runs }}"
          --cloud "${{ inputs.cloud-url }}"
          --bucket "${{ inputs.bucket }}"
          --post-comment )
        if [ -n "${{ inputs.cloud-app }}" ]; then
          args+=( --app "${{ inputs.cloud-app }}" )
        fi
        if [ -n "${{ inputs.only }}" ]; then
          args+=( --only "${{ inputs.only }}" )
        fi
        if [ -n "${{ inputs.no }}" ]; then
          args+=( --no "${{ inputs.no }}" )
        fi
        if [ "${{ inputs['confirm-on-sim'] }}" = "true" ]; then
          args+=( --confirm-on-sim )
        fi
        reproit "${args[@]}"
