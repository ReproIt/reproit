<!doctype html>
<meta charset="utf-8">
<title>Reproit Electron adversarial fixture: the input accepts no characters</title>
<script>
  // Adversarial corpus subject. The input is readonly, so no key inserts a
  // character. A naive oracle reads "the f character is missing" and blames the
  // application. Nothing here is instrumented for the oracle's benefit: the
  // attribution is settled by the control key, which also fails to insert.
  window.__reproit = { fullscreenChanges: 0, fullscreenErrors: 0, errors: [] };
  document.addEventListener('fullscreenchange', () => {
    window.__reproit.fullscreenChanges += 1;
  });
  document.addEventListener('fullscreenerror', () => {
    window.__reproit.fullscreenErrors += 1;
  });
  window.addEventListener('error', (event) => {
    window.__reproit.errors.push(String(event.message).slice(0, 200));
  });
  window.addEventListener('unhandledrejection', (event) => {
    window.__reproit.errors.push(String(event.reason).slice(0, 200));
  });
</script>
<h1 id="heading">Reproit field fixture</h1>
<label for="note">Note</label>
<input id="note" type="text" value="" readonly>
<p id="state">idle</p>
