name: native-backend-gates

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      run_macos_ax:
        description: "Run the macOS AX gate on a runner with accessibility permission"
        required: false
        default: false
        type: boolean
      run_flutter_ios:
        description: "Run the generated Flutter application on an iOS simulator"
        required: false
        default: true
        type: boolean
      run_windows_uia:
        description: "Collect exact-commit UIA evidence from the native Windows VM"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  linux-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Rust and native libraries
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y libatspi2.0-dev clang xvfb
      - name: Install browser runner and engines
        working-directory: runners/web
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - run: python3 validation/native/preflight.py linux-hosted
      - name: Run hosted Linux native gates
        env:
          REPROIT_GATE_OUTPUT_DIR: ${{ runner.temp }}/native-gates
        run: |
          python3 validation/backends/gate.py web-chromium
          python3 validation/backends/gate.py web-engines
          xvfb-run -a python3 validation/backends/gate.py electron
          python3 validation/backends/gate.py tui-pty
          python3 validation/backends/gate.py backend-contract
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gates-linux-hosted
          path: ${{ runner.temp }}/native-gates
          if-no-files-found: error

  linux-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - run: python3 validation/native/preflight.py linux-containers
      - name: Set up persistent Docker builder
        uses: docker/setup-buildx-action@v4
      - name: Build cached Tauri gate image
        uses: docker/build-push-action@v7
        with:
          context: validation/backends
          file: validation/backends/tauri.Dockerfile
          load: true
          tags: reproit-tauri-backend
          cache-from: type=gha,scope=tauri-native-gate-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=tauri-native-gate-${{ runner.arch }},ignore-error=true
      - name: Run disposable Linux container gates
        env:
          REPROIT_GATE_OUTPUT_DIR: ${{ runner.temp }}/native-gates
          REPROIT_TAURI_GATE_IMAGE_READY: "1"
        run: |
          python3 validation/backends/gate.py tauri
          python3 validation/backends/gate.py linux-atspi-gtk
          python3 validation/backends/gate.py linux-atspi-toolkits
          python3 validation/backends/gate.py process-capsule-longrun
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gates-linux-containers
          path: ${{ runner.temp }}/native-gates
          if-no-files-found: error

  android-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
      - name: Install Rust and native libraries
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y libatspi2.0-dev
      - name: Install Appium and runner dependencies
        run: |
          npm ci --prefix runners/rn
          npm install -g appium@3.5.2
          appium driver install uiautomator2@8.0.0
      - run: python3 validation/native/preflight.py android
      - name: Enable KVM
        run: |
          rule='KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'
          printf '%s\n' "$rule" | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android native gates
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-android-native-gates.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gates-android
          path: ${{ runner.temp }}/native-gates
          if-no-files-found: error

  macos-swiftui:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Configure cache paths
        run: |
          {
            echo "APPIUM_HOME=$RUNNER_TEMP/reproit-appium-home"
            echo "npm_config_cache=$RUNNER_TEMP/reproit-npm-cache"
            echo "REPROIT_APPIUM_ROOT=$RUNNER_TEMP/reproit-appium"
            echo "REPROIT_RN_RUNNER_MODULES=runners/rn/node_modules"
            echo "REPROIT_WDA_DERIVED_DATA_PATH=$RUNNER_TEMP/reproit-wda-derived"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Select pinned Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/reproit-npm-cache
          key: macos-${{ runner.arch }}-npm-node-24-v1
          restore-keys: macos-${{ runner.arch }}-npm-
      - name: Cache Appium and the XCUITest driver
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/reproit-appium
            ${{ runner.temp }}/reproit-appium-home
          key: macos-${{ runner.arch }}-appium-3.5.2-xcuitest-11.16.2-node-24-v1
      - name: Cache React Native runner dependencies
        uses: actions/cache@v6
        with:
          path: runners/rn/node_modules
          key: >-
            macos-${{ runner.arch }}-rn-runner-${{
            hashFiles('runners/rn/package-lock.json') }}
      - id: wda-cache
        name: Cache WebDriverAgent build output
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/reproit-wda-derived
          key: macos-${{ runner.arch }}-wda-xcode-26.2-xcuitest-11.16.2-v1
      - name: Prepare cached Appium tools
        run: bash .github/scripts/setup-macos-appium.sh
      - run: python3 validation/native/preflight.py macos-appium-swiftui
      - name: Run SwiftUI through Appium
        env:
          REPROIT_GATE_OUTPUT_DIR: ${{ runner.temp }}/native-gates
          REPROIT_WDA_USE_PREBUILT: >-
            ${{ steps.wda-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: python3 validation/backends/gate.py swiftui-ios
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gates-macos-swiftui
          path: ${{ runner.temp }}/native-gates
          if-no-files-found: error

  macos-react-native:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Configure cache paths
        run: |
          {
            echo "APPIUM_HOME=$RUNNER_TEMP/reproit-appium-home"
            echo "CP_HOME_DIR=$RUNNER_TEMP/reproit-cocoapods"
            echo "npm_config_cache=$RUNNER_TEMP/reproit-npm-cache"
            echo "REPROIT_APPIUM_ROOT=$RUNNER_TEMP/reproit-appium"
            echo "REPROIT_RN_IOS_CACHE_ROOT=$RUNNER_TEMP/reproit-rn-ios"
            echo "REPROIT_RN_RUNNER_MODULES=runners/rn/node_modules"
            echo "REPROIT_WDA_DERIVED_DATA_PATH=$RUNNER_TEMP/reproit-wda-derived"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Select pinned Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/reproit-npm-cache
          key: macos-${{ runner.arch }}-npm-node-24-v1
          restore-keys: macos-${{ runner.arch }}-npm-
      - name: Cache CocoaPods downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/reproit-cocoapods
          key: macos-${{ runner.arch }}-cocoapods-rn-0.76.9-v1
          restore-keys: macos-${{ runner.arch }}-cocoapods-
      - name: Cache Appium and the XCUITest driver
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/reproit-appium
            ${{ runner.temp }}/reproit-appium-home
          key: macos-${{ runner.arch }}-appium-3.5.2-xcuitest-11.16.2-node-24-v1
      - name: Cache React Native runner dependencies
        uses: actions/cache@v6
        with:
          path: runners/rn/node_modules
          key: >-
            macos-${{ runner.arch }}-rn-runner-${{
            hashFiles('runners/rn/package-lock.json') }}
      - id: wda-cache
        name: Cache WebDriverAgent build output
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/reproit-wda-derived
          key: macos-${{ runner.arch }}-wda-xcode-26.2-xcuitest-11.16.2-v1
      - id: rn-product-cache
        name: Cache the compiled React Native application
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/reproit-rn-ios/product
            ${{ runner.temp }}/reproit-rn-ios/.reproit-build-input
          key: >-
            macos-${{ runner.arch }}-rn-ios-xcode-26.2-rn-0.76.9-${{
            hashFiles('validation/backends/run-react-native-ios.sh',
            'fixtures/react-native-fixture/**') }}
      - name: Cache the generated React Native application
        if: steps.rn-product-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/reproit-rn-ios/app
          key: >-
            macos-${{ runner.arch }}-rn-ios-project-cli-15.1.3-rn-0.76.9-v1
      - name: Install the pinned FFmpeg version
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install ffmpeg@7
          echo "$(brew --prefix ffmpeg@7)/bin" >> "$GITHUB_PATH"
      - name: Prepare cached Appium tools
        run: bash .github/scripts/setup-macos-appium.sh
      - run: python3 validation/native/preflight.py macos-appium
      - name: Run React Native through Appium
        env:
          REPROIT_GATE_OUTPUT_DIR: ${{ runner.temp }}/native-gates
          REPROIT_WDA_USE_PREBUILT: >-
            ${{ steps.wda-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: python3 validation/backends/gate.py react-native-ios
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gates-macos-react-native
          path: ${{ runner.temp }}/native-gates
          if-no-files-found: error

  macos-flutter:
    if: github.event_name != 'workflow_dispatch' || inputs.run_flutter_ios
    runs-on: macos-15
    # The gate budget (2400s) must cover three full retry tiers; both red runs
    # on 2026-08-02 show the old 1500s budget killing the fresh-simulator tier
    # mid-attempt, so the ladder never got its final bounded try. 50 minutes is
    # that gate budget plus checkout, Flutter, Rust, and cache setup.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Select pinned Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
      - run: python3 validation/native/preflight.py macos-flutter
      - name: Run Flutter on a disposable simulator
        env:
          REPROIT_GATE_OUTPUT_DIR: ${{ runner.temp }}/native-gates
        run: python3 validation/backends/gate.py flutter-ios
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gates-macos-flutter
          path: ${{ runner.temp }}/native-gates
          if-no-files-found: error

  macos-ax:
    if: github.event_name == 'workflow_dispatch' && inputs.run_macos_ax
    runs-on: [self-hosted, macOS, ARM64, reproit-ax]
    environment: native-macos-ax
    # 20 was the shortest bound of any job here, and this is the only one that
    # builds Rust from a COLD cargo cache: a self-hosted runner starts with an
    # empty target directory on its first run, and the hosted jobs that build
    # Rust are given 45 to 60. The first attempt was cancelled at 20 minutes
    # mid-build, which reads as a gate failure rather than as a bound that was
    # never realistic. Subsequent runs reuse the runner's persistent _work
    # directory, so this ceiling only binds the first one.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Select pinned Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify permissioned runner prerequisites
        env:
          REPROIT_AX_PERMISSION_CONFIRMED: "1"
        run: python3 validation/native/preflight.py macos-ax --require-ax-permission
      - name: Run macOS AX with explicit permission
        env:
          REPROIT_GATE_OUTPUT_DIR: ${{ runner.temp }}/native-gates
        run: python3 validation/backends/gate.py macos-ax
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gates-macos-ax
          path: ${{ runner.temp }}/native-gates
          if-no-files-found: error

  windows-uia:
    # Opt-in, like macos-ax, because the bridge is a self-hosted runner that is
    # only online on demand. This used to run on every push, where it could
    # never be scheduled, so native-backend-gates never reached a conclusion at
    # all: 12 consecutive runs sat queued rather than reporting red or green.
    # A gate nobody can ever see the result of is worse than one that is off.
    if: github.event_name == 'workflow_dispatch' && inputs.run_windows_uia
    runs-on: [self-hosted, macOS, ARM64, reproit-windows-bridge]
    environment: native-windows-uia
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 validation/native/preflight.py windows-bridge
      - name: Collect exact-commit evidence from the native Windows VM
        env:
          REPROIT_GATE_OUTPUT_DIR: ${{ runner.temp }}/native-gates
        run: validation/causal/run-windows-remote.sh "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gates-windows-uia
          path: ${{ runner.temp }}/native-gates
          if-no-files-found: error
