name: native-backend-gates

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      run_macos_ax:
        description: "Run the macOS AX gate on a runner with accessibility permission"
        required: false
        default: false
        type: boolean
      run_flutter_ios:
        description: "Run the generated Flutter application on an iOS simulator"
        required: false
        default: true
        type: boolean
      run_windows_uia:
        description: "Collect exact-commit UIA evidence from the native Windows VM"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  linux-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Rust and native libraries
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          sudo apt-get update
          sudo apt-get install -y libatspi2.0-dev clang xvfb
      - name: Install browser runner and engines
        working-directory: runners/web
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - run: python3 validation/native/preflight.py linux-hosted
      - name: Run hosted Linux native gates
        env:
          REPROIT_GATE_OUTPUT_DIR: ${{ runner.temp }}/native-gates
        run: |
          python3 validation/backends/gate.py web-chromium
          python3 validation/backends/gate.py web-engines
          xvfb-run -a python3 validation/backends/gate.py electron
          python3 validation/backends/gate.py tui-pty
          python3 validation/backends/gate.py backend-contract
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gates-linux-hosted
          path: ${{ runner.temp }}/native-gates
          if-no-files-found: error

  linux-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - run: python3 validation/native/preflight.py linux-containers
      - name: Run disposable Linux container gates
        env:
          REPROIT_GATE_OUTPUT_DIR: ${{ runner.temp }}/native-gates
        run: |
          python3 validation/backends/gate.py tauri
          python3 validation/backends/gate.py linux-atspi-gtk
          python3 validation/backends/gate.py linux-atspi-toolkits
          python3 validation/backends/gate.py process-capsule-longrun
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gates-linux-containers
          path: ${{ runner.temp }}/native-gates
          if-no-files-found: error

  android-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
      - name: Install Rust and native libraries
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          sudo apt-get update
          sudo apt-get install -y libatspi2.0-dev
      - name: Install Appium and runner dependencies
        run: |
          npm ci --prefix runners/rn
          npm install -g appium@3.5.2
          appium driver install uiautomator2@8.0.0
      - run: python3 validation/native/preflight.py android
      - name: Enable KVM
        run: |
          rule='KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'
          printf '%s\n' "$rule" | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android native gates
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-android-native-gates.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gates-android
          path: ${{ runner.temp }}/native-gates
          if-no-files-found: error

  macos-swiftui:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install SwiftUI runner dependencies
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          npm ci --prefix runners/rn
          npm install -g appium@3.5.2
          appium driver install xcuitest@11.16.2
      - name: Select pinned Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
      - run: python3 validation/native/preflight.py macos-appium
      - name: Run SwiftUI and React Native through Appium
        env:
          REPROIT_GATE_OUTPUT_DIR: ${{ runner.temp }}/native-gates
        run: bash .github/scripts/run-swiftui-native-gate.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gates-macos-swiftui
          path: ${{ runner.temp }}/native-gates
          if-no-files-found: error

  macos-flutter:
    if: github.event_name != 'workflow_dispatch' || inputs.run_flutter_ios
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
      - name: Install Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Select pinned Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
      - run: python3 validation/native/preflight.py macos-flutter
      - name: Run Flutter on a disposable simulator
        env:
          REPROIT_GATE_OUTPUT_DIR: ${{ runner.temp }}/native-gates
        run: python3 validation/backends/gate.py flutter-ios
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gates-macos-flutter
          path: ${{ runner.temp }}/native-gates
          if-no-files-found: error

  macos-ax:
    if: github.event_name == 'workflow_dispatch' && inputs.run_macos_ax
    runs-on: [self-hosted, macOS, ARM64, reproit-ax]
    environment: native-macos-ax
    # 20 was the shortest bound of any job here, and this is the only one that
    # builds Rust from a COLD cargo cache: a self-hosted runner starts with an
    # empty target directory on its first run, and the hosted jobs that build
    # Rust are given 45 to 60. The first attempt was cancelled at 20 minutes
    # mid-build, which reads as a gate failure rather than as a bound that was
    # never realistic. Subsequent runs reuse the runner's persistent _work
    # directory, so this ceiling only binds the first one.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Select pinned Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Verify permissioned runner prerequisites
        env:
          REPROIT_AX_PERMISSION_CONFIRMED: "1"
        run: python3 validation/native/preflight.py macos-ax --require-ax-permission
      - name: Run macOS AX with explicit permission
        env:
          REPROIT_GATE_OUTPUT_DIR: ${{ runner.temp }}/native-gates
        run: python3 validation/backends/gate.py macos-ax
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gates-macos-ax
          path: ${{ runner.temp }}/native-gates
          if-no-files-found: error

  windows-uia:
    # Opt-in, like macos-ax, because the bridge is a self-hosted runner that is
    # only online on demand. This used to run on every push, where it could
    # never be scheduled, so native-backend-gates never reached a conclusion at
    # all: 12 consecutive runs sat queued rather than reporting red or green.
    # A gate nobody can ever see the result of is worse than one that is off.
    if: github.event_name == 'workflow_dispatch' && inputs.run_windows_uia
    runs-on: [self-hosted, macOS, ARM64, reproit-windows-bridge]
    environment: native-windows-uia
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 validation/native/preflight.py windows-bridge
      - name: Collect exact-commit evidence from the native Windows VM
        env:
          REPROIT_GATE_OUTPUT_DIR: ${{ runner.temp }}/native-gates
        run: validation/causal/run-windows-remote.sh "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gates-windows-uia
          path: ${{ runner.temp }}/native-gates
          if-no-files-found: error
