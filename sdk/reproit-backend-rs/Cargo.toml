[package]
name = "reproit-backend"
version = "0.0.0"
edition = "2021"
license.workspace = true
repository.workspace = true
# 0.0.0 and unpublished, deliberately: there is no release of this crate, so any
# other version number would claim one that does not exist. The README and
# metadata are in place and `cargo publish --dry-run` passes once this flag and
# the version are changed together, which is a decision, not a task: publishing
# permanently claims the crates.io name and opens a distribution channel this
# repo does not use today.
publish = false
description = "Trace-bound service instrumentation for ReproIt: effect-grounded backend verdicts"
readme = "README.md"
keywords = ["testing", "observability", "middleware", "axum", "actix"]
categories = ["development-tools::testing", "web-programming"]

[features]
# First-class framework middleware, feature-gated so the core adapter stays
# dependency-light.
axum = ["dep:axum", "dep:http-body", "dep:tower-layer", "dep:tower-service"]
actix = ["dep:actix-web", "dep:futures-core"]
# Outbound-exchange capture and hermetic replay (instrument::http / db).
# tokio provides the task-local ambient trace; apps using the framework
# middleware already run on tokio.
instrument = ["dep:tokio"]
# The canonical DB driver wrap (tokio-postgres), with the replay connect
# stub so an app boots with the database down.
pg = ["instrument", "dep:tokio-postgres"]

[dependencies]
base64 = "0.22"
reqwest = { workspace = true, features = ["blocking"] }
reproit-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"

actix-web = { version = "4", optional = true, default-features = false, features = ["macros"] }
axum = { version = "0.8", optional = true, default-features = false }
futures-core = { version = "0.3", optional = true }
http-body = { version = "1", optional = true }
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }
tokio = { workspace = true, optional = true }
tokio-postgres = { version = "0.7", optional = true, features = ["with-serde_json-1"] }

[dev-dependencies]
# Examples and middleware tests serve real sockets; the library dependency
# above stays default-features = false.
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "hermetic_fixture"
required-features = ["axum", "instrument"]

[[example]]
name = "replay_parity_probe"
required-features = ["instrument"]

[[example]]
name = "adapter_benchmark"
required-features = ["axum"]
